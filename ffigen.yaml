# Run with `dart run ffigen --config ffigen.yaml`.
name: CubedartBindings
description: |
  Bindings for `src/cubedart.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/cubedart_bindings_generated.dart'
# Generate `@Native` externals resolved through Native Assets (hook/build.dart).
ffi-native:
  asset-id: 'package:cubedart/cubedart_bindings_generated.dart'
headers:
  entry-points:
    - 'src/cubedart.h'
  include-directives:
    - 'src/cubedart.h'
comments:
  style: any
  length: full
