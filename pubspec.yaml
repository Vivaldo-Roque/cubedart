name: cubedart
description: "A Dart FFI package (Native Assets) wrapping CubeCPP for 3x3 Rubik's Cube obfuscation and solving."
version: 0.1.0
repository: https://github.com/Vivaldo-Roque/cubedart


environment:
  sdk: ^3.11.4
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  # Native Assets build hook (hook/build.dart).
  code_assets: '>=1.0.0 <3.0.0'
  hooks: ^2.0.0
  native_toolchain_c: ^0.19.2

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Native code is compiled by hook/build.dart (Native Assets), so this package
# is no longer declared as an `ffiPlugin`.
